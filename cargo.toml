[package]
name = "arx"
version = "1.1.0"
edition = "2021"
description = "arx — zip / tar / tar.gz в одной команде"
license = "MIT"

[[bin]]
name = "arx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
zip = "0.6"
tar = "0.4"
flate2 = "1.0"
walkdir = "2.4"
anyhow = "1.0"
indicatif = "0.17"
